name: Provision AWS infrastructure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/infrastructure.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ vars.AWS_REGION }}-${{ vars.TF_WORKSPACE_KEY || 'dev' }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform plan and apply
    runs-on: ubuntu-latest
    environment: infrastructure
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Prepare backend configuration
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ vars.TF_STATE_BUCKET }}"
          key          = "${{ vars.TF_STATE_KEY }}"
          region       = "${{ vars.AWS_REGION }}"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Terraform format
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend-config=backend.hcl

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan -var="aws_region=${{ vars.AWS_REGION }}" -var="environment=${{ vars.ENVIRONMENT || 'dev' }}"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Export infrastructure outputs
        id: outputs
        run: |
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "aws_region=$(terraform output -raw aws_region)" >> "$GITHUB_OUTPUT"
          {
            echo "### Infrastructure ready"
            echo "- EKS cluster: $(terraform output -raw cluster_name)"
            echo "- ECR repository: $(terraform output -raw ecr_repository_url)"
          } >> "$GITHUB_STEP_SUMMARY"
